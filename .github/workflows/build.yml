
name: Build Navid Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Navid Music project..."
          ls -la

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK if Gradle project exists
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle assembleDebug
          else
            echo "Android project files are not added yet."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Navid-Music-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
